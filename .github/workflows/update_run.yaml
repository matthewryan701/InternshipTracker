name: Internship Tracker

on:
  schedule:
    - cron: "0 */4 * * *"   # Runs every 4 hours
  workflow_dispatch:          # Allows manual runs from the Actions tab

jobs:
  check-internships:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      # Restore the state file from the previous run (so we don't re-alert)
      - name: Restore seen-internships cache
        uses: actions/cache@v4
        with:
          path: seen_internships.json
          key: seen-internships-${{ runner.os }}
          restore-keys: seen-internships-

      - name: Run checker
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          # Optional overrides (defaults to Gmail):
          # SMTP_HOST: ${{ secrets.SMTP_HOST }}
          # SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python checker.py

      # Save the updated state file for the next run
      - name: Save seen-internships cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_internships.json
          key: seen-internships-${{ runner.os }}-${{ github.run_id }}
